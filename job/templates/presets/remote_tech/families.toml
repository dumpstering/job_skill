# Preset: remote US program, product, IT and AI leadership roles at tech, SaaS,
# AI and cloud companies (watchlist.csv in this folder).
# Setup copies this file to config/search_profile.toml when the user's field
# is program or IT management and they want remote work, then fills [home]
# label and zip from profile.md. Nothing in it is personal.
#
# Term syntax (see templates/search_profile.toml): whole words; "stem*";
# "a+b" needs every part; "a|b" is either. Families are tried in file order,
# so the specific ones come first and the general program family last.
#
# Design notes:
# - Remote first: [home] remote = "us". A hybrid job counts only in a [home]
#   place within radius_miles; setup fills them from profile.md, or leaves
#   them empty for a remote-only search.
# - Director and Head of titles are in (a reach family), Vice President,
#   Chief and anything sales, marketing or recruiting are out.
# - Hardware and silicon program roles need an engineering degree: their
#   words are avoid_any in the program families (G9).
# - A posting that requires a PMP is a knockout until profile.md "Licenses
#   held:" lists pmp; "PMP preferred" only lowers fit.
# - The IT leadership family is active for a user from IT operations, and
#   paused for anyone else.

version = 1

[home]
label = ""                  # setup fills "City, ST" from profile.md
zip = ""
radius_miles = 30
states = []                 # setup fills the home state for hybrid jobs
places = []                 # hybrid jobs: accepted city names, confirmed once; empty = remote only
second_ring = []
remote = "us"
relocate = false

[gates]
exclude_title_words = ["Vice President", "VP", "SVP", "EVP", "Chief", "Intern", "Interns", "Internship", "co-op",
                       "student", "sales", "account executive", "account manager", "business development",
                       "marketing", "recruiter", "recruiting", "talent acquisition", "customer success",
                       "software engineer", "data scientist", "machine learning engineer", "research scientist",
                       "designer", "accountant", "paralegal", "nurse", "physician", "warehouse", "driver",
                       "technician", "help desk", "helpdesk", "desktop support", "service desk analyst"]
employment_types = ["full-time", "contract"]
shift_work = "last"
pay_floor = 150000          # yearly dollars; a job whose stated pay tops out below it is dropped
                            # (no stated pay: kept); 0 is off
undated_policy = "first_seen_after_2_polls"

[[knockout]]
id = "clearance"
name = "Active security clearance"
required_patterns = ['(?i)\b(active|current) (security|secret|top secret|TS/SCI) clearance\b']

[[knockout]]
id = "pmp"
name = "PMP certification"
required_patterns = ['(?i)\bPMP\b[^.;\n]{0,30}\b(required|is a must|mandatory)',
                     '(?i)\b(must|required to) (hold|have) (an? )?(active )?PMP\b']
preferred_patterns = ['(?i)\bPMP\b[^.;\n]{0,30}\b(preferred|a plus|desired|nice to have)']

[[knockout]]
id = "engineering_degree"
name = "Engineering or computer science degree required"
required_patterns = ['(?i)\b(BS|B\.S\.|bachelor.s|degree) in (electrical|mechanical|computer) engineering[^.;\n]{0,30}\brequired']

# ---------- title families (specific first) ----------

[[family]]
id = "ai_program"
label = "AI program, enablement and transformation"
status = "active"
mode = "industry"
core_titles = ["AI Program Manager", "AI Enablement Lead", "AI Transformation Manager", "AI Adoption Manager",
               "GenAI Program Manager", "AI Operations Manager", "Automation Program Manager",
               "Intelligent Automation Manager", "AI Enablement Manager"]
adjacent_titles = ["Copilot Program Manager", "AI Strategy Manager", "Digital Transformation Manager"]
title_any = ["ai|genai|gen ai|generative ai|artificial intelligence|llm|copilot|automation|intelligent automation|digital transformation+program|programs|enablement|adoption|transformation|operations|strategy|lead|manager|director|head"]
title_none = ["engineer", "scientist", "researcher", "sales", "marketing", "account", "trainer", "annotator",
              "data labeling", "rater", "tutor", "writer"]
require_any = ["ai", "artificial intelligence", "generative", "genai", "llm*", "machine learning", "copilot",
               "automation", "agent*", "chatbot*", "workflow*"]
avoid_any = ["phd required", "publications", "pytorch", "tensorflow", "model training", "cuda", "kernel*",
             "distributed training"]
terms = ["AI adoption", "Copilot", "Copilot Studio", "automation", "chatbot", "Power Automate", "Azure OpenAI",
         "change management", "program management", "stakeholder management", "roadmap", "metrics",
         "deflection", "governance", "AI governance", "Jira Service Management", "process improvement"]
seniority_ok = ["senior", "sr", "lead", "manager", "principal", "staff", "director", "head"]
needs_license = []
priority = 1
min_share = 0.25

