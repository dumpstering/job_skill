# Preset: life-science title families, license knockouts and San Francisco
# Bay Area places (research run 2, with the verifier's fixes applied).
# Setup copies this file to config/search_profile.toml when the user's field
# and region match, then fills [home] label and zip from profile.md. Nothing in
# it is personal: the places are regional.
#
# Term syntax (see templates/search_profile.toml): whole words; "stem*";
# "a+b" needs every part; "a|b" is either. Families are tried in file order,
# so the specific ones come first and the general scientist families last.
# For academic, institute and government employers (watch-list segment) a
# cv-mode family wins over an industry one; usajobs-mode families take only
# USAJOBS postings.
#
# Fixes from the verifier (families_research verdicts):
# - CAPA and deviation are whole words ("Capacity Planner" no longer matches);
#   deviation needs specialist, investigator or analyst.
# - Clinical lab(oratory) scientist, CLS, clinical microbiology scientist,
#   medical lab technician / scientist / technologist, MLS, MLT, MT(ASCP) and
#   public health microbiologist are license knockouts and title_none terms
#   in the families they leaked into; trainee titles are exempt and have
#   their own (proposed) family.
# - Specialist, product specialist, applications specialist, technical writer
#   and lecturer / instructor titles need a science word in the title.
# - Intern, internship, co-op and graduate intern are global excludes.
# - Stanford's "Life Science Research Professional" matches; bare "research
#   professional" excludes social science.
# - Formulation and physical scientist are out of the scientist family;
#   clinical research titles stay out of the research associate family.
# - Bare upstream, downstream, purification and scale-up need a bio word.
#
# Fixes from the live day (v1.2 hardening, judged against real postings):
# - The general scientist family leaves out chemistry, cheminformatics,
#   statistics, toxicology, drug safety, bioinformatics, imaging and
#   engineering titles, and needs a wet-lab word (cell culture, assay, PCR,
#   lab, ...) in the requirements, which leaves out ML and computational
#   roles; academic staff research needs a biology word. require_any is read
#   in the requirements sections, not the company blurb.
# - "EM specialist" means environmental monitoring, never cryo-EM.
# - Field application titles need scientist, specialist or support.
# - QC analyst / specialist / associate titles join quality and validation;
#   "Fellow" in a biology title is a postdoc; research safety is biosafety.
# - "Pre-clinical" and "clinical laboratory associate" titles stay in the
#   research associate family; clinical research and licensed clinical lab
#   titles stay out of it.
#
# Fixes from live day 2 (271 pooled postings, each labeled by "could a
# microbiology PhD, casting a wide net in the Bay Area, plausibly be hired
# for it?"; tests/fixtures/pool/labeled_2026-11-06.json):
# - Another field's training is out: formulation* (also "Formulations"),
#   developability, biophysics, LNP and drug delivery, pharmaceutics,
#   packaging, mass spectrometry, PKPD, pathologist and beamline titles leave
#   the scientist family, and its avoid_any (G9) drops a job whose
#   requirements name more chemistry, LC-MS, biophysics or machine-learning
#   words than wet-lab words. "Business development" and SVP/EVP are global
#   excludes.
# - "Materials" means materials science only ("Reference Materials" stays).
#   Bare "engineering" is out only as process, device, systems, chemical,
#   mechanical or manufacturing engineering (vector engineering stays).
# - Senior, manager, principal and lead titles leave the regulatory and
#   clinical research families (they need years in that field); senior MSL
#   and senior writer titles too.
# - QA reviewer and QC supervisor titles join quality and validation.
#
# Fixes from live day 3 (v1.2 round 4):
# - Seniority is judged against the user, not here: the gates read the
#   user's years and title levels from the achievement library (or the
#   [experience] override in settings.toml) and drop only a posting clearly
#   beyond them; the rest that asks for more is listed after the others.
# - "HR" right after a number ("08-HR", "8 HR") is a shift length, not human
#   resources. Stanford Health Care's phlebotomy lab assistants ("Lab
#   Assistant III-P") stay out of the research associate family.
# - Another field's postdocs and research roles (the round 4 LBNL reader
#   lists every division: accelerator physics, quantum devices,
#   electrochemistry, energy and earth systems) leave the postdoc, research
#   associate and industry scientist families by title, and the postdoc
#   family's G9 words need a biology word in the posting and drop one whose
#   text names more of those fields. Metabolic or strain engineering stays.
#
# Round 6 (a second kind of user: bioprocess and manufacturing sciences;
# live day 4's pool and discards labeled for that profile,
# tests/fixtures/pool/labeled_bioprocess_2026-11-10.json):
# - Five families ship paused, for the user whose background they fit:
#   bioprocess engineering / MSAT / tech transfer, GMP manufacturing, lab
#   operations, CMC writing and project roles, and bioprocess field
#   application and technical support. Setup sets each family's status from
#   the user's own roles (active, proposed or paused); nothing here names a
#   person. Every family the earlier rounds tuned keeps its titles.
# - "Process engineer", "manufacturing associate" and the like are told
#   apart on the requirements text (G9), never by the title: require_any
#   names bioprocess words (bioreactor, cell culture, chromatography, viral
#   vector, drug substance, ...) and avoid_any the words of device,
#   semiconductor, chemical-plant and software work (medical device, ISO
#   13485, injection molding, wafer, refinery, firmware, ...).
# - The process development family's require_any had no downstream, viral
#   vector or cell therapy word, so real postings were dropped ("Scientist
#   II, Downstream Viral Vector Process Development", "Production Specialist
#   II Cell Therapy Cell Culture"): those words are in, and its avoid_any
#   keeps small-molecule process chemistry and sequencing-consumable process
#   development out.
# - title_allow ["associate director"] keeps an Associate Director title in
#   a family whose title_none has "director"; the seniority rule then judges
#   it as a principal-level title against the user's years.
# - Quality and validation takes CQV, process and cleaning validation, batch
#   record and batch release titles; the microbiologist family takes natural
#   product, antibiotic and anti-infective discovery titles.
# - Pay, temporary jobs and shift work are the user's own settings in
#   [gates] (pay_floor, employment_types, shift_work), and a second region
#   they would move to is a [[home.region]] table, off until enabled.
# - A user can add min_terms to a broad family ("Scientist", assay
#   development): a posting there must name that many of their own terms
#   (techniques.md). No family here sets it.

version = 1

[home]
label = ""                  # setup fills "City, ST" from profile.md
zip = ""
radius_miles = 40
states = ["CA"]             # a place name beside another state ("Newark, NJ") does not count
places = ["San Francisco", "South San Francisco", "Brisbane", "Daly City", "San Bruno", "Millbrae",
          "Burlingame", "San Mateo", "Foster City", "Belmont", "San Carlos", "Redwood City",
          "Redwood Shores", "Menlo Park", "Palo Alto", "Stanford", "East Palo Alto", "Los Altos",
          "Mountain View", "Sunnyvale", "Santa Clara", "San Jose", "Cupertino", "Milpitas", "Campbell",
          "Los Gatos", "Fremont", "Newark", "Union City", "Hayward", "San Leandro", "Alameda", "Oakland",
          "Emeryville", "Berkeley", "Albany", "Richmond", "El Cerrito", "Pleasanton", "Dublin",
          "San Ramon", "Livermore", "Walnut Creek", "Half Moon Bay", "Pacifica", "Moffett Field",
          "Bay Area", "San Francisco Bay Area", "SF Bay Area", "Peninsula", "Silicon Valley"]
second_ring = ["Vacaville", "Fairfield", "Vallejo", "Benicia", "Martinez", "Concord", "Pleasant Hill",
               "Danville", "Santa Cruz", "Scotts Valley", "Watsonville", "Morgan Hill", "Gilroy",
               "Petaluma", "Novato", "San Rafael", "Napa", "Santa Rosa", "Tracy", "Davis"]
remote = "us"
relocate = false

# A second region you would move to for the right job: off until enabled =
# true. Its jobs are marked relocate and listed after the home ones, and are
# judged by this region's own pay_floor (0: the [gates] floor). A job there
# that states no pay is dropped unless unstated_pay = "keep". One table per
# region; with no places, anywhere in its states counts.
# [[home.region]]
# label = "Boston area"
# enabled = false
# states = ["MA"]
# places = ["Boston", "Cambridge", "Waltham", "Lexington", "Bedford", "Watertown", "Woburn", "Framingham"]
# pay_floor = 0
# unstated_pay = "drop"
#
# [[home.region]]
# label = "San Diego"
# enabled = false
# states = ["CA"]
# places = ["San Diego", "La Jolla", "Carlsbad", "Oceanside", "Sorrento Valley", "Torrey Pines"]
# pay_floor = 0
#
# [[home.region]]
# label = "Research Triangle"
# enabled = false
# states = ["NC"]
# places = ["Durham", "Raleigh", "Chapel Hill", "Cary", "Morrisville", "Research Triangle Park", "Holly Springs",
#           "Sanford", "Clayton"]
# pay_floor = 0

[gates]
# The global exclude (research design implication, plus the verifier's intern
# and co-op leaks). Director is left to each family's title_none, so the
# proposed study-director family can still see "Associate Director".
exclude_title_words = ["Vice President", "VP", "SVP", "EVP", "Chief", "head of", "Intern", "Interns", "Internship",
                       "co-op", "coop", "graduate intern", "student", "undergraduate", "sales",
                       "business development", "account executive", "account manager", "customer success",
                       "titling", "payroll",
                       "benefits", "recruiter", "recruiting", "talent", "human resources", "marketing",
                       "help desk", "helpdesk", "desktop support", "software", "web", "seo", "accounting",
                       "finance", "legal", "paralegal", "facilities", "security officer", "driver",
                       "warehouse", "retail", "insurance", "loan", "mortgage", "real estate", "billing",
                       "medical coding", "call center", "claims", "IT", "HR"]
employment_types = ["full-time", "contract", "temporary"]  # leave out "temporary" to drop temp jobs
                                                           # (temp-to-hire and contract-to-hire stay)
shift_work = "any"          # "last": night, swing, weekend and 12-hour shift jobs go after everything else
pay_floor = 0               # yearly dollars; a job whose stated pay tops out below it is dropped
                            # (hourly rates count at 2,080 hours; no stated pay: kept); 0 is off
undated_policy = "first_seen_after_2_polls"

# ---------- license knockouts (CDPH Laboratory Field Services; F07-F10) ----------
# Research, academic and biotech lab years do not count toward any of these.
# Trainee postings are exempt (license path, paid training).

[[knockout]]
id = "ca_cls"
name = "California Clinical Laboratory Scientist license"
title_patterns = ['(?i)^(?!.*\btrainee\b).*\b(CLS|clinical lab(oratory)? scientist)\b']
required_patterns = ['(?i)\b(CLS|clinical lab(oratory)? scientist)\b(?! trainee)[^.;\n]{0,40}\b(licen[cs]e|licensure|required)',
                     '(?i)\bCalifornia (CLS|clinical laboratory scientist) licen[cs]e']
preferred_patterns = ['(?i)\b(CLS|clinical lab(oratory)? scientist)\b[^.;\n]{0,40}\b(preferred|a plus|desired)']

[[knockout]]
id = "ca_cms"
name = "California Clinical Microbiologist Scientist license"
title_patterns = ['(?i)^(?!.*\btrainee\b).*\bclinical microbiolog(y|ist) scientist\b']
required_patterns = ['(?i)\bclinical microbiolog(y|ist) scientist (licen[cs]e|certificate)']

[[knockout]]
id = "ca_mlt"
name = "California Medical Laboratory Technician license"
title_patterns = ['(?i)^(?!.*\btrainee\b).*(\bmedical lab(oratory)? technician\b|\bMLT\b)']
required_patterns = ['(?i)\b(MLT|medical laboratory technician) (licen[cs]e|certificate|certification)\b(?! trainee)']

[[knockout]]
id = "ascp_mls"
name = "Medical Laboratory Scientist / MT(ASCP) credential"
title_patterns = ['(?i)^(?!.*\btrainee\b).*(\bmedical lab(oratory)? (scientist|technologist)\b|\bMLS\b|\bMT ?\(ASCP\)|\bmedical technologist\b)']
required_patterns = ['(?i)\b(MLS|MT) ?\(ASCP\)[^.;\n]{0,30}\b(required|certification)']

[[knockout]]
id = "ca_phm"
name = "California Public Health Microbiologist certificate"
title_patterns = ['(?i)^(?!.*\btrainee\b).*\bpublic health microbiologist\b']
required_patterns = ['(?i)\bpublic health microbiologist (certificate|certification)\b']

[[knockout]]
id = "clearance"
name = "Active security clearance"
required_patterns = ['(?i)\b(active|current) (security|secret|top secret|TS/SCI) clearance\b']

