# Work-search presets per state (spec 6.6), read by worksearch.py.
#
# Every rule value is a table {value, ref, confirmed}:
#   value      what worksearch.py uses
#   ref        the research finding behind it (worksearch A<n>), or "design"
#   confirmed  true when an official page read live states it; false when the
#              value is a default or the source was not confirmed. Check the
#              claimant's own notice (CA DE 429Z, TX TWC letter) before relying on
#              an unconfirmed value.
#
# Keys:
#   weekly_minimum   contacts a week (0 = no fixed number)
#   min_days         distinct days a week with a contact (0 = no rule)
#   week_start       first day of the claim week (sunday | monday)
#   entry_mode       portal (typed in with each certification) | record (kept, shown on request)
#   period_weeks     weeks per certification (the export period)
#   ready_rows       rows per week in the ready-to-type block of the .md
#   website          which URL the ready-to-type block shows: posting | main
#   checks           extra per-week checks: new_employers, days, same_employer_location, repeat_job,
#                    applications_plus_activity
#   registration     the job-bank registration rule, said once at setup
#   retention        how long the state says to keep the record (worksearch A21)
# Unlisted states use [generic]. Rows are never deleted; keep them at least 2 years.

[generic]
name = "Other state"
weekly_minimum = { value = 0, ref = "design", confirmed = false }
min_days = { value = 0, ref = "design", confirmed = false }
week_start = { value = "sunday", ref = "worksearch A15", confirmed = false }
entry_mode = { value = "record", ref = "design", confirmed = false }
period_weeks = { value = 1, ref = "design", confirmed = false }
ready_rows = { value = 5, ref = "design", confirmed = false }
website = { value = "posting", ref = "design", confirmed = false }
checks = { value = [], ref = "design", confirmed = false }
registration = { value = "", ref = "design", confirmed = false }
retention = { value = "at least 2 years (the longest period any state gives)", ref = "worksearch A21", confirmed = false }
note = "Check your state's work-search rules: this export has every column, a Sunday-Saturday week and no minimum."

